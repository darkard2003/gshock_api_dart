name: gshock_api_dart
description: >-
  Cross-platform Dart & Flutter library for Casio G-Shock Bluetooth watches.
  Pure-Dart core with swappable BLE transports (Flutter, Linux BlueZ, and Mock).
version: 0.1.0
homepage: https://github.com/darkard2003/gshock_api_dart
repository: https://github.com/darkard2003/gshock_api_dart
issue_tracker: https://github.com/darkard2003/gshock_api_dart/issues

environment:
  sdk: ^3.13.0

dependencies:
  # Pure-Dart IANA timezone database (no Flutter / platform dependency).
  timezone: ^0.11.1

dev_dependencies:
  bluez: ^0.8.3
  lints: ^6.0.0
  test: ^1.25.6
